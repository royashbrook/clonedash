name: webkit diagnostic
# DIAGNOSTIC ONLY, never merged (#122). Second run: in the official 1.64.1 image only, where the
# offline song render crashed 20 of 20, the same render under three compose variants (src/music.ts
# on this branch): a unchanged (must still crash here, or the run is inconclusive), b without the
# LFO depth -> filter frequency edge, c with the LFO never stopped. One job per variant, so one
# failing cannot stop another; 20 repeats, retries 0, every result kept.
on:
  push:
    branches: [webkit-diag]
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b, c]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the image's browsers belong to 1.64.1, so the runner package must match them
      - run: npm install --no-save --save-exact @playwright/test@1.64.1
      - name: Record versions
        run: |
          uname -a; grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          npx playwright --version
          node -p "'webkit revision ' + JSON.parse(require('fs').readFileSync('node_modules/playwright-core/browsers.json', 'utf8')).browsers.find(b => b.name === 'webkit').revision"
      - run: npm run build
      - name: Cases
        timeout-minutes: 25
        run: npx playwright test tests/zz-diag-audio.spec.js --project webkit --repeat-each 20 --retries 0 --output diag-results --reporter=line,json
        env:
          COMPOSE_VARIANT: ${{ matrix.variant }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: diag-report/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-diag-audio-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            diag-results/
            diag-report/
          retention-days: 14
