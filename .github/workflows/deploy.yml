name: Deploy Clone Dash
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Clone Dash checks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: clonedash-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # the same version-matched image as the checks (#122)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          # A late check for an old merge must never displace the newest release.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:mutations
      - run: RELEASE_BUILD=1 npm run build
      - run: npm run test:release
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        # every run, so a failure the retry hid still leaves its first attempt
        if: always()
        with:
          name: browser-test-results-deploy-${{ github.run_id }}
          path: test-results/
          retention-days: 14
      - name: Refuse a superseded release
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the live release receipt
        # The artifact deployed above, not a rebuild, must be what the origin serves.
        run: node scripts/verify-live.mjs https://clonedash.royashbrook.com "$(git rev-parse HEAD)"
